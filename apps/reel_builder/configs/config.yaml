# ── Pipeline ──────────────────────────────────────────────────────────────────
pipeline:
  max_clips: 20
  min_confidence: 0.55
  sc_min_confidence: 0.45   # minimum confidence for scoring_chance clips to enter reel
  sc_rescue_confidence: 0.75  # demoted no-banner goals at/above this become scoring chances
  add_overlays: true
  music_path: null          # set to a .mp3 path to add background music

# ── Goal chaining (goal → celebration → replay sequence) ──────────────────────
goal_chaining:
  max_lookahead: 25         # max segments to scan after a goal for celebration/replay
  max_gap_s: 10.0           # stop chaining if >Xs of non-highlight content accumulates

# ── Faceoff-pattern goal inference ────────────────────────────────────────────
goal_inference:
  max_lookahead: 5          # faceoff cutscene must appear within this many virtual steps
  min_sc_confidence: 0.45   # scoring_chance must be at least this confident to be promoted
  min_faceoff_confidence: 0.60  # faceoff/faceoff_cutscene must be at least this confident to trigger

# ── Ingestion ─────────────────────────────────────────────────────────────────
ingestion:
  target_fps: 30
  target_resolution: "1920x1080"
  crf: 18                   # FFmpeg quality (lower = better quality, larger file)

# ── Scene detection ───────────────────────────────────────────────────────────
scene_detection:
  threshold: 20.0           # ContentDetector threshold (lower = more cuts)
  min_scene_len: 20         # Minimum scene length in frames
  max_scene_duration_s: 45  # Force-split any scene longer than this (seconds)

# ── Audio analysis ────────────────────────────────────────────────────────────
audio:
  frame_length: 2048
  hop_length: 512
  top_db: 15.0
  min_duration_s: 1.0

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  base_model: "MCG-NJU/videomae-base"
  checkpoint_path: "models/checkpoints/videomae_nhl"
  num_frames: 16
  labels:
    - goal
    - celebration
    - goal_replay
    - other_replay
    - scoring_chance
    - faceoff_cutscene
    - faceoff
    - other

# ── Game clock detection ──────────────────────────────────────────────────────
game_clock:
  min_template_conf: 0.45      # OCR gate (all events); loose — just filters black screens
  min_game_end_conf: 0.85      # confidence gate for game_end / regulation_end (reverse scan)
  min_period_end_conf: 0.85    # confidence gate for period_end events (forward scan)
  min_period_start_conf: 0.85  # confidence gate for period-start template matches
  period_end_confirm_window_s: 10.0   # ±Xs dense rescan around each period_end candidate
  period_end_confirm_min_hits: 2      # period_end accepted only if ≥N frames confirm it
  period_end_confirm_interval_s: 1.0  # rescan interval (seconds) inside confirmation window

# ── Training ──────────────────────────────────────────────────────────────────
training:
  data_dir: "data/labeled"
  output_dir: "models/checkpoints/videomae_nhl"
  epochs: 15
  batch_size: 8
  learning_rate: 5.0e-5
  use_wandb: true
