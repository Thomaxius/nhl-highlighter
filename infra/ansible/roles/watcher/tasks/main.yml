---
- name: Copy YouTube watcher script
  ansible.builtin.copy:
    src: ../../../../apps/poller/youtube_watcher.py
    dest: "{{ app_dir }}/apps/poller/youtube_watcher.py"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy YouTube upload script
  ansible.builtin.copy:
    src: ../../../../apps/uploader/upload_youtube.py
    dest: "{{ app_dir }}/apps/uploader/upload_youtube.py"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Template watcher environment file
  ansible.builtin.template:
    src: watcher.env.j2
    dest: "{{ app_dir }}/config/watcher.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"  # secrets — not world-readable

- name: Template systemd service
  ansible.builtin.template:
    src: nhl-watcher.service.j2
    dest: /etc/systemd/system/nhl-watcher.service
    mode: "0644"
  notify: Reload and restart watcher

- name: Enable and start watcher service
  ansible.builtin.systemd:
    name: nhl-watcher
    enabled: true
    state: started
    daemon_reload: true

- name: Print setup instructions
  ansible.builtin.debug:
    msg:
      - "==== NEXT STEPS ===="
      - "1. Edit {{ app_dir }}/config/watcher.env — fill in YOUTUBE_CHANNEL_ID"
      - "2. Run OAuth consent locally (once): set env vars and run youtube_watcher.py interactively to generate token.json"
      - "3. Upload OAuth credentials: scp config/client_secrets.json config/token.json root@SERVER:{{ app_dir }}/config/"
      - "4. Upload model checkpoint: scp -r models/checkpoints/videomae_nhl root@SERVER:{{ app_dir }}/models/checkpoints/"
      - "5. Restart watcher: systemctl restart nhl-watcher"
      - "6. Check logs: journalctl -u nhl-watcher -f"
