---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - python3-dev
      - build-essential
      - git
      - curl
      - wget
      - ffmpeg
      - tesseract-ocr
      - tesseract-ocr-eng
      - libgl1
      - libglib2.0-0t64
      - htop
      - ufw
      - nodejs  # required by yt-dlp EJS challenge solver (must be v22+)
    state: present

- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    home: /home/{{ app_user }}
    create_home: true
    shell: /bin/bash

- name: Configure UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Print model checkpoint reminder
  ansible.builtin.debug:
    msg: >-
      REMINDER: Upload your trained model to the server after this playbook
      completes: scp -r apps/shared/models/checkpoints/videomae_nhl
      root@YOUR_SERVER_IP:{{ app_dir }}/apps/shared/models/checkpoints/
