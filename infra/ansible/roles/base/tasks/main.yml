---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - python3-dev
      - build-essential
      - git
      - curl
      - wget
      - ffmpeg
      - tesseract-ocr
      - tesseract-ocr-eng
      # OpenCV dependencies
      - libgl1
      - libglib2.0-0t64
      - libxcb1
      - libsm6
      - libxext6
      - libxrender-dev
      - libgomp1
      - libopenblas0
      - liblapack3
      - libglu1-mesa
      # System utilities
      - htop
      - ufw
      - nodejs  # required by yt-dlp EJS challenge solver (must be v22+)
    state: present

# 8 GB swap: the pipeline peaks near the 8 GB RAM limit during concurrent
# video scans — swap absorbs the spikes instead of the OOM killer firing.
- name: Check if swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create 8G swapfile
  ansible.builtin.command: fallocate -l 8G /swapfile
  when: not swapfile_stat.stat.exists

- name: Secure swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swapfile
  ansible.builtin.command: mkswap /swapfile
  when: not swapfile_stat.stat.exists

- name: Enable swapfile in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"

- name: Activate swap now
  ansible.builtin.command: swapon /swapfile
  when: ansible_swaptotal_mb < 1024

- name: Only swap under memory pressure
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-swappiness.conf
    content: "vm.swappiness=10\n"
  register: swappiness_conf

- name: Apply swappiness
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-swappiness.conf
  when: swappiness_conf.changed

- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    home: /home/{{ app_user }}
    create_home: true
    shell: /bin/bash

- name: Configure UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Print model checkpoint reminder
  ansible.builtin.debug:
    msg: >-
      REMINDER: Upload your trained model to the server after this playbook
      completes: scp -r apps/shared/models/checkpoints/videomae_nhl
      root@YOUR_SERVER_IP:{{ app_dir }}/apps/shared/models/checkpoints/
