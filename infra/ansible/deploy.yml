---
# Re-deploy app code without touching system packages.
# Usage: ansible-playbook -i inventory.ini deploy.yml
- name: Deploy updated code
  hosts: nhl_server
  become: true
  tasks:
    - name: Pull latest code
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Sync app scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop:
        - { src: ../apps/uploader/upload_youtube.py, dest: apps/uploader/upload_youtube.py }
        - { src: ../apps/processor/process_local.py, dest: apps/processor/process_local.py }

    - name: Smoke-test the pipeline environment
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python apps/reel_builder/pipeline.py --smoke-test"
        chdir: "{{ app_dir }}"
      changed_when: false
